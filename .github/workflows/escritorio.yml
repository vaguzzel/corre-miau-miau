# Compila la versión de escritorio (Windows y Mac) con Tauri en los servidores de GitHub
# y la publica como descarga en "Releases". Se activa al subir una etiqueta vX.Y.Z
# (por ejemplo: git tag v1.0.0 && git push --tags) o a mano desde la pestaña Actions.
name: Versión de escritorio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            argumentos: ""
          - plataforma: macos-latest
            argumentos: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # Los íconos de escritorio se generan a partir del ícono en pixel art de la PWA
      - run: npx tauri icon public/iconos/icono-512.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Corre Miau Miau ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "Descarga el instalador para tu sistema. En Windows: el archivo .exe o .msi. En Mac: el archivo .dmg."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.argumentos }}
